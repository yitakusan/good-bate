upstream stockgood_app {
    server app:8002;
}

server {
    listen 80;
    server_name _;

    # Redirect to HTTPS when certs are present; otherwise serve HTTP for first boot.
    # Place fullchain.pem + privkey.pem under deploy/certs/ to enable TLS server below.

    client_max_body_size 20m;

    location /api/ {
        proxy_pass http://stockgood_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location /media/ {
        proxy_pass http://stockgood_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /docs {
        proxy_pass http://stockgood_app;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://stockgood_app;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://stockgood_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
}

